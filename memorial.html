<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>기억을 세우다 | 제주 4·3 디지털 아카이브</title>
<meta name="description" content="제주대학교 4·3 기념비를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=3">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  .page-title{
    margin: 6px 24px 0;
    font-weight:800;
    font-size: 28px;
    letter-spacing:-0.5px;
    color: var(--ink);
  }

  /* ---------- 기념비 사진 / 3D 뷰어 ---------- */
  .memorial-visual{
    position:relative;
    margin: 20px 24px 0;
    height: 250px;
    border-radius: 14px;
    overflow:hidden;
    background:var(--placeholder);
  }
  .memorial-visual model-viewer{
    position:absolute; inset:0;
    width:100%; height:100%;
    opacity:0;
    pointer-events:none;
    transition: opacity .3s ease;
    --poster-color: transparent;
  }
  .memorial-visual model-viewer.ready{
    opacity:1;
    pointer-events:auto;
  }
  .memorial-visual canvas{
    position:absolute; inset:0;
    width:100% !important;
    height:100% !important;
    display:block;
    opacity:0;
    cursor:grab;
    transition: opacity .4s ease;
  }
  .memorial-visual canvas.ready{ opacity:1; }
  .memorial-visual canvas:active{ cursor:grabbing; }
  .visual-caption{
    margin: 12px 24px 0;
    text-align:center;
    font-size: 13px;
    color: var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---------- 비문 인용구 ---------- */
  .quote-block{
    margin: 22px 24px 0;
    padding-left: 14px;
    border-left: 2px solid var(--maroon);
  }
  .quote-text{
    font-size: 16px;
    font-weight:700;
    line-height:1.5;
    color: var(--ink);
    min-height: 90px;
  }
  .quote-attr{
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  /* ---------- 기념비 설명 ---------- */
  .memorial-desc{
    margin: 26px 24px 0;
    text-align:center;
    font-size: 15px;
    font-weight:700;
    line-height:1.7;
    color: var(--ink);
    min-height: 66px;
  }

  /* ---------- 건립 정보 ---------- */
  .stat-row{
    display:flex;
    justify-content:space-between;
    margin: 24px 24px 0;
    gap: 10px;
  }
  .stat{
    flex: 1 1 0;
    min-width: 0;
    text-align:left;
  }
  .stat .label{
    font-size: 11px;
    line-height:1.45;
    color: var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat .value{
    margin-top:4px;
    font-size: 15px;
    line-height:1.4;
    font-weight:700;
    letter-spacing:-0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* 언어별로 글자 길이가 달라도 한글 버전과 같은 화면 크기를 유지하기 위한 보정 */
  body.lang-en .stat .value{ font-size: 12px; }

</style>
</head>
<body>
<div id="stage">
<div class="screen" id="screen">

  <!-- Header -->
  <header class="header">
    <img class="mark" src="assets/camellia-mark.png" alt="">
    <span class="title">제주 4·3 디지털 아카이브</span>
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn" aria-label="언어 선택">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3Z"/></svg>
      </button>
      <div class="lang-dropdown" id="langDropdown"></div>
    </div>
    <a class="home-btn" href="index.html" aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
    </a>
  </header>

  <h1 class="page-title" id="pageTitle">기억을 세우다</h1>

  <!-- 기념비: 실제 3D 모델(assets/memorial.glb)이 생기면 자동으로 그걸 불러와 보여주고,
       아직은 없으니 대신 예시 기념비 모양(직접 그린 3D 도형)을 돌려볼 수 있게 보여준다. -->
  <div class="memorial-visual" id="memorialVisual">
    <model-viewer
      id="memorialModel"
      src="assets/memorial.glb"
      alt="제주대학교 4·3 기념비 3D 모델"
      camera-controls
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="16deg"
      interaction-prompt="none"
      disable-zoom
      shadow-intensity="1">
    </model-viewer>
    <canvas id="stoneCanvas"></canvas>
  </div>
  <p class="visual-caption" id="visualCaption">예시 기념비 3D예요 — 손가락으로 밀어 돌려보세요</p>

  <!-- 비문 -->
  <div class="quote-block">
    <div class="quote-text" id="quoteText">"비문 내용"</div>
    <div class="quote-attr" id="quoteAttr">비문 중에서 - 2026년</div>
  </div>

  <!-- 기념비 설명 -->
  <p class="memorial-desc" id="memorialDesc">기념비 설명</p>

  <!-- 건립 정보 -->
  <div class="stat-row">
    <div class="stat">
      <div class="label" id="statLabel1">[건립 연도]</div>
      <div class="value" id="statValue1">2026년</div>
    </div>
    <div class="stat">
      <div class="label" id="statLabel2">[건립 주체]</div>
      <div class="value" id="statValue2">제주대학교</div>
    </div>
    <div class="stat">
      <div class="label" id="statLabel3">[건립 위치]</div>
      <div class="value" id="statValue3">동백 정원</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="kr">제주 4·3 디지털 아카이브</div>
    <div class="en">JEJU 4·3 DIGITAL ARCHIVE</div>
    <p class="msg">제주대학교<br>4·3의 기록과 기억을 보존하고<br>다음 세대에 전합니다.</p>
    <div class="univ">@ JEJU NATIONAL UNIVERSITY</div>
    <img class="bloom" src="assets/camellia-line.png" alt="">
  </footer>

</div>
</div>

<script src="assets/fit-screen.js"></script>
<script src="assets/lang-switch.js?v=3"></script>
<script>
  const modelEl = document.getElementById("memorialModel");
  const canvasEl = document.getElementById("stoneCanvas");
  const caption = document.getElementById("visualCaption");

  // 예시 기념비(직접 그린 3D 도형): 실제 스캔 모델이 없는 동안 보여줄 대체 3D. 항상 드래그로 회전 가능.
  function initStoneMonument() {
    const container = document.getElementById("memorialVisual");
    const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

    const ambient = new THREE.AmbientLight(0xfaf3e4, 0.85);
    scene.add(ambient);
    const key = new THREE.DirectionalLight(0xfff2dc, 1.15);
    key.position.set(3, 6, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8fa070, 0.35);
    fill.position.set(-4, 2, -3);
    scene.add(fill);

    const stoneMat = new THREE.MeshStandardMaterial({ color: 0xb7ae9c, roughness: 0.9, metalness: 0.04 });
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x8f8a78, roughness: 0.95, metalness: 0.04 });

    const group = new THREE.Group();

    // 2단 받침대
    const base1 = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.42, 2.2), baseMat);
    base1.position.y = 0.21;
    group.add(base1);
    const base2 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.36, 1.7), baseMat);
    base2.position.y = 0.6;
    group.add(base2);

    // 비석 몸체
    const stele = new THREE.Mesh(new THREE.BoxGeometry(1.6, 3.1, 0.62), stoneMat);
    stele.position.y = 2.33;
    group.add(stele);

    // 비석 윗부분(둥근 캡)
    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.8, 0.8, 0.62, 32, 1, false, 0, Math.PI),
      stoneMat
    );
    cap.rotation.z = Math.PI / 2;
    cap.rotation.y = Math.PI / 2;
    cap.position.y = 3.88;
    group.add(cap);

    group.position.y = -2.1;
    scene.add(group);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.6;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minPolarAngle = Math.PI / 2 - 0.35;
    controls.maxPolarAngle = Math.PI / 2 + 0.2;
    controls.target.set(0, 0, 0);
    camera.position.set(2.6, 1.1, 7.4);
    camera.lookAt(controls.target);

    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    canvasEl.classList.add("ready");
  }

  if (window.THREE && window.THREE.OrbitControls) {
    initStoneMonument();
  }

  let modelReady = false;

  // 실제 3D 모델(assets/memorial.glb)을 성공적으로 불러오면 예시 도형 대신 진짜 모델을 보여준다.
  modelEl.addEventListener("load", function () {
    modelEl.classList.add("ready");
    canvasEl.classList.remove("ready");
    modelReady = true;
    caption.textContent = (I18N[currentLang] || I18N.ko).captionReady;
    if (window.__fitScreen) window.__fitScreen();
  });

  // 아직 실제 모델 파일이 없거나 불러오지 못하면 예시 도형을 그대로 보여준다.
  modelEl.addEventListener("error", function () {
    modelEl.classList.remove("ready");
  });

  // ---------- 다국어 번역 (기계번역 초안 — 공개 전 원어민 검수 권장) ----------
  const I18N = {
    ko: {
      pageTitle: "기억을 세우다",
      captionPlaceholder: "예시 기념비 3D예요 — 손가락으로 밀어 돌려보세요",
      captionReady: "손가락으로 밀어 기념비를 돌려보세요",
      quoteText: "\"비문 내용\"",
      quoteAttr: "비문 중에서 - 2026년",
      memorialDesc: "기념비 설명",
      statLabel1: "[건립 연도]", statValue1: "2026년",
      statLabel2: "[건립 주체]", statValue2: "제주대학교",
      statLabel3: "[건립 위치]", statValue3: "동백 정원"
    },
    en: {
      pageTitle: "Raising a Memorial",
      captionPlaceholder: "This is a sample 3D memorial — drag to rotate",
      captionReady: "Drag to rotate the memorial",
      quoteText: "\"Inscription text\"",
      quoteAttr: "From the inscription - 2026",
      memorialDesc: "Memorial description",
      statLabel1: "[Year Built]", statValue1: "2026",
      statLabel2: "[Built By]", statValue2: "Jeju Univ.",
      statLabel3: "[Location]", statValue3: "Camellia Garden"
    },
    zh: {
      pageTitle: "树立记忆",
      captionPlaceholder: "这是示例纪念碑3D模型 — 用手指滑动即可旋转",
      captionReady: "用手指滑动旋转纪念碑",
      quoteText: "\"碑文内容\"",
      quoteAttr: "摘自碑文 - 2026年",
      memorialDesc: "纪念碑说明",
      statLabel1: "[建立年度]", statValue1: "2026年",
      statLabel2: "[建立主体]", statValue2: "济州大学校",
      statLabel3: "[建立位置]", statValue3: "山茶花庭院"
    },
    ja: {
      pageTitle: "記憶を刻む",
      captionPlaceholder: "記念碑の3D例です — 指で回してみてください",
      captionReady: "指で押して記念碑を回してみてください",
      quoteText: "「碑文の内容」",
      quoteAttr: "碑文より - 2026年",
      memorialDesc: "記念碑の説明",
      statLabel1: "[建立年度]", statValue1: "2026年",
      statLabel2: "[建立主体]", statValue2: "済州大学校",
      statLabel3: "[建立場所]", statValue3: "椿庭園"
    }
  };

  let currentLang = "ko";

  window.__applyLanguage = function (lang) {
    currentLang = lang;
    const t = I18N[lang] || I18N.ko;
    document.getElementById("pageTitle").textContent = t.pageTitle;
    caption.textContent = modelReady ? t.captionReady : t.captionPlaceholder;
    document.getElementById("quoteText").textContent = t.quoteText;
    document.getElementById("quoteAttr").textContent = t.quoteAttr;
    document.getElementById("memorialDesc").textContent = t.memorialDesc;
    document.getElementById("statLabel1").textContent = t.statLabel1;
    document.getElementById("statValue1").textContent = t.statValue1;
    document.getElementById("statLabel2").textContent = t.statLabel2;
    document.getElementById("statValue2").textContent = t.statValue2;
    document.getElementById("statLabel3").textContent = t.statLabel3;
    document.getElementById("statValue3").textContent = t.statValue3;
    if (window.__fitScreen) window.__fitScreen();
  };
</script>
</body>
</html>
