<style>
  /* 모달이 화면(.screen) 영역 안에서만 떠야 하므로 기준점을 만들어준다 */
  .screen{ position:relative; }

  .page-title{
    margin: 4px 24px 0;
    font-weight:800;
    font-size: 28px;
    letter-spacing:-0.5px;
    color: var(--ink);
  }
  .subtitle{
    margin: 6px 24px 0;
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink-soft);
  }

  /* ---------- 가운데 블록: 헤더/타이틀과 푸터 사이 남는 공간에서 수직 중앙에 온다 ---------- */
  .mid-wrap{
    flex: 1 1 auto;
    min-height: 0;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  /* ---------- 사진 캐러셀: 가운데 큰 사진 = 선택된 연도, 양옆 작은 사진 = 이전/다음 연도(끝없이 순환) ---------- */
  .carousel{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin: 0 24px;
    touch-action:none;
  }
  .car-slot{
    position:relative;
    flex:0 0 auto;
    box-sizing:border-box;
    border-radius:16px;
    overflow:hidden;
    background: var(--placeholder);
    transition: width .22s ease, height .22s ease, opacity .22s ease, border-color .22s ease;
  }
  .car-slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition: opacity .25s ease;
  }
  .car-slot img:not([src]){ display:none; }
  .car-slot img.loaded{ opacity:1; }
  .car-prev, .car-next{
    width:76px;
    height:103px;
    opacity:.5;
    cursor:pointer;
  }
  .car-center{
    width:140px;
    height:169px;
    opacity:1;
    border: 3px solid var(--maroon);
    box-shadow: 0 10px 22px -6px rgba(58,68,41,0.35);
  }

  .year-big{
    margin: 18px 24px 0;
    text-align:center;
    color: var(--maroon);
    font-weight:700;
    font-size: 25px;
    letter-spacing: 0.5px;
  }
  .event-title{
    margin: 10px 24px 0;
    height: 56px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:800;
    font-size: 21px;
    line-height:1.3;
    letter-spacing:-0.3px;
    overflow:hidden;
  }
  .event-desc{
    margin: 14px 24px 0;
    height: 185px;
    overflow:hidden;
    font-size: 13px;
    line-height:1.65;
    color: var(--ink);
    text-align:left;
  }

  /* ---------- 점 표시: 몇 번째 연도인지 ---------- */
  .dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    margin: 12px 24px 0;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--line);
    cursor:pointer;
    transition: all .2s ease;
  }
  .dot.active{
    width:16px;
    border-radius:4px;
    background: var(--maroon);
  }

  /* ---------- 전체 기록 보기 ---------- */
  .more-wrap{
    display:flex;
    justify-content:center;
    margin: 18px 24px 0;
  }
  .more-link{
    border:none;
    background:none;
    padding:1px 6px;
    font-family: inherit;
    font-size:12.5px;
    font-weight:700;
    color: var(--maroon);
    cursor:pointer;
    letter-spacing:-0.1px;
    line-height:1.3;
  }

  /* ---------- 모달: 전체 일지 ---------- */
  .modal-backdrop{
    position:absolute;
    inset:0;
    background: rgba(40,28,20,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 66px 20px;
    opacity:0;
    visibility:hidden;
    transition: opacity .2s ease;
    z-index:50;
  }
  .modal-backdrop.open{
    opacity:1;
    visibility:visible;
  }
  .modal-box{
    width:100%;
    max-height:100%;
    background: var(--bg);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow: 0 24px 48px -10px rgba(0,0,0,0.35);
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding: 10px 14px 7px 0;
    flex-shrink:0;
  }
  .modal-close{
    flex-shrink:0;
    border:none;
    background:none;
    font-size:22px;
    line-height:1;
    color: var(--ink-soft);
    cursor:pointer;
    padding:2px 4px;
  }
  .modal-body{
    flex:1;
    overflow-y:auto;
    padding: 16px 18px 20px 22px;
  }
  .modal-body::-webkit-scrollbar{ width:5px; }
  .modal-body::-webkit-scrollbar-track{ background: rgba(138,63,54,0.07); border-radius: 999px; }
  .modal-body::-webkit-scrollbar-thumb{ background: rgba(138,63,54,0.45); border-radius: 999px; }
  .rec{
    position:relative;
    padding: 0 0 14px 16px;
    margin-left:4px;
    border-left: 2px solid var(--line);
  }
  .rec:last-child{ padding-bottom:2px; }
  .rec::before{
    content:"";
    position:absolute;
    left:-5px; top:3px;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--maroon);
  }
  .rec-date{
    font-size:12px;
    font-weight:800;
    color: var(--maroon);
    margin-bottom:3px;
  }
  .rec-text{
    font-size:12.5px;
    line-height:1.6;
    color: var(--ink);
    white-space:pre-line;
  }

</style>
</head>

<script>
  // 언어별 제목/설명. 기계번역 초안이라 공개 전 원어민 검수를 권장한다.
  const YEARS = [
    { y: 1947,
      ko: { title: "3·1사건, 총성이 울리다", desc: "1947년 3월 1일, 경찰의 발포로 주민 6명이 사망하고 8명이 부상당하는 3·1사건이 발생했다. 이에 항의하는 민·관 총파업이 제주도 전역으로 확산되었고, 미군정과 경찰은 파업 참가자들을 대규모로 검거했다.\n\n5월에는 3·1사건 관련자 328명에 대한 재판이 마무리되었다. 이후 미군정의 좌파 세력 검거와 우익 청년단체의 활동이 이어지면서 제주 사회의 좌우익 갈등과 긴장이 더욱 심화되었다." },
      en: { title: "The March 1st Incident: Gunshots Ring Out", desc: "On March 1, 1947, police gunfire killed six residents and wounded eight others in the March 1st Incident. A joint civilian-official general strike protesting the incident spread across Jeju Island, and the U.S. military government and police carried out mass arrests of strike participants.\n\nIn May, the trial of 328 people charged in connection with the March 1st Incident concluded. Afterward, as the U.S. military government's crackdown on leftist forces and the activities of right-wing youth groups continued, the conflict and tension between left and right in Jeju society deepened further." },
      zh: { title: "3·1事件，枪声响起", desc: "1947年3月1日，警察开枪导致6名居民死亡、8人受伤，引发3·1事件。抗议该事件的军民总罢工扩散至济州岛全境，美军政厅与警方对罢工参与者展开大规模搜捕。\n\n5月，与3·1事件相关的328人受审一案审理终结。此后，美军政厅对左翼势力的搜捕行动与右翼青年团体的活动持续进行，济州社会左右翼之间的矛盾与紧张进一步加深。" },
      ja: { title: "3·1事件、銃声が鳴り響く", desc: "1947年3月1日、警察の発砲により住民6人が死亡、8人が負傷する3·1事件が発生した。これに抗議する民官総罷業が済州島全域に広がり、米軍政と警察はストライキ参加者を大規模に検挙した。\n\n5月には3·1事件関連者328人に対する裁判が終結した。その後、米軍政による左派勢力の検挙と右翼青年団体の活動が続き、済州社会における左右対立と緊張はさらに深まった。" } },
    { y: 1948,
      ko: { title: "제주4·3 무장봉기 발발", desc: "1948년 4월 3일, 무장대가 제주도 내 경찰지서와 우익단체 관계자들의 집을 공격하면서 제주4·3사건이 시작되었다. 평화협상이 진행되기도 했으나 5월 오라리 방화사건으로 결렬되었고, 진압작전이 강화되었다.\n\n11월 17일 제주도 전역에 계엄령이 선포된 뒤 토벌대의 초토화 작전이 본격화되면서 중산간 마을의 가옥이 불타고 수많은 주민이 집단 희생되었다." },
      en: { title: "The Jeju 4·3 Armed Uprising Breaks Out", desc: "In February 1948, opposition to the separate elections in South Korea spread, and the Jeju branch of the South Korean Labor Party decided on armed struggle.\n\nOn April 3, armed insurgents attacked police substations and the homes of right-wing organization members across Jeju, marking the full-scale start of the Jeju 4·3 Incident. Peace negotiations were attempted, but they broke down after the Orari arson incident in May, and suppression operations intensified.\n\nEven after the government of the Republic of Korea was established on August 15, armed conflict continued. In October, a decree was issued banning passage through mid-mountain areas more than 5km from the coast, and on November 17, martial law was declared across Jeju Island.\n\nAfterward, as the suppression forces' scorched-earth operations intensified, houses in mid-mountain villages were burned down and large numbers of residents were killed en masse." },
      zh: { title: "济州4·3武装起义爆发", desc: "1948年2月，反对南韩单独选举的运动扩散，南劳党济州岛党部决定发动武装斗争。\n\n4月3日，武装队袭击济州岛内的警察支署及右翼团体相关人员的住宅，济州4·3事件正式爆发。虽曾进行和平谈判，但因5月发生的吾罗里纵火事件而谈判破裂，镇压行动随之加强。\n\n8月15日大韩民国政府成立后，武力冲突仍在继续。10月，当局颁布禁止通行距海岸5公里以上中山间地区的布告令，11月17日济州岛全境宣布戒严。\n\n此后，讨伐队的焦土作战全面展开，中山间村庄的房屋被焚毁，大批居民惨遭集体杀害。" },
      ja: { title: "済州4·3武装蜂起勃発", desc: "1948年2月、南韓単独選挙に反対する動きが広がり、南労党済州島党は武装闘争を決定した。\n\n4月3日、武装隊が済州島内の警察支署と右翼団体関係者の家を襲撃し、済州4·3事件が本格的に始まった。平和交渉も行われたが、5月の吾羅里放火事件により交渉は決裂し、鎮圧作戦が強化された。\n\n8月15日に大韓民国政府が樹立された後も武力衝突は続いた。10月、海岸から5km以上離れた中山間地域の通行を禁止する布告令が出され、11月17日には済州島全域に戒厳令が宣布された。\n\nその後、討伐隊による焦土作戦が本格化し、中山間村落の家屋が焼かれ、多くの住民が集団犠牲となった。" } },
    { y: 1949,
      ko: { title: "토벌대에 의한 '북촌사건' 발생", desc: "1949년 1월 17일, 토벌대가 북촌리 주민 약 400명을 집단 총살하는 북촌사건이 발생했다. 이후에도 군경의 토벌작전과 주민 희생이 계속 이어졌다.\n\n6월 무장대 총사령 이덕구가 사살되었고, 10월에는 제주비행장 인근에서 사형이 선고된 249명이 총살되었다." },
      en: { title: "Suppression Forces Carry Out the 'Bukchon Incident'", desc: "In January 1949, suppression forces continued their crackdown on mid-mountain villages, and on January 17, the Bukchon Incident occurred, in which about 400 residents of Bukchon-ri were shot and killed en masse.\n\nSuppression operations by the military and police and the resulting civilian deaths continued afterward; in February, a joint operation in the Bonggae district claimed many more residents' lives. In March, the Jeju Island District Combat Command was established, and suppression operations continued.\n\nIn May, a by-election for Jeju's National Assembly seat was held, and in June, Lee Deok-gu, the commander-in-chief of the armed insurgents, was killed. From June to July, civilians were convicted en masse by military tribunals, and in October, 249 people sentenced to death were executed near Jeju Airport." },
      zh: { title: "镇压部队制造'北村事件'", desc: "1949年1月，讨伐队持续对中山间村庄进行镇压，1月17日在北村里发生集体枪杀约400名居民的北村事件。\n\n此后军警的讨伐行动与居民伤亡持续发生，2月奉盖地区联合行动导致众多居民遇难。3月设立济州岛地区战斗司令部，镇压行动持续进行。\n\n5月举行济州岛国会议员补选，6月武装队总司令李德九被击毙。6月至7月间，军事法庭对大批平民判处有罪，10月在济州机场附近，249名被判处死刑者遭枪决。" },
      ja: { title: "討伐隊による「北村事件」発生", desc: "1949年1月、討伐隊は中山間村落への鎮圧を続け、1月17日には北村里で住民約400人を集団銃殺する北村事件が発生した。\n\nその後も軍警の討伐作戦と住民犠牲が続き、2月には鳳蓋地区合同作戦で多くの住民が犠牲となった。3月には済州島地区戦闘司令部が設置され、鎮圧作戦が続いた。\n\n5月には済州島国会議員再選挙が実施され、6月に武装隊総司令の李徳九が射殺された。6月から7月にかけて軍法会議で民間人が大量に有罪判決を受け、10月には済州飛行場付近で死刑を宣告された249人が銃殺された。" } },
    { y: 1950,
      ko: { title: "예비검속과 집단학살", desc: "1950년 6·25전쟁이 발발하자 제주에서는 보도연맹원 등을 대상으로 예비검속이 이루어졌다. 7월부터 8월까지 제주항 앞바다와 섯알오름 등에서 예비검속자들이 집단적으로 희생되었다.\n\n문형순 성산포경찰서장은 부당한 총살 명령을 거부했다. 9월 인천상륙작전 이후 예비검속자 석방이 시작되었고, 10월 제주도 계엄령이 해제되었다." },
      en: { title: "Preventive Detention and Mass Killings", desc: "When the Korean War broke out in 1950, members of the Bodo League and others under police surveillance in Jeju were subjected to preventive detention and imprisonment. From July to August, those held under preventive detention were killed en masse at sites including the waters off Jeju Port, Jeju Airport, and Seotal Oreum.\n\nIn particular, the remains of those killed at Seotal Oreum were not recovered until 1956, and bereaved families buried the remains of multiple victims together in a single grave, naming it **\"Baekjoilsonjimyo\"** (the Tomb of One Hundred Ancestors and One Descendant). Meanwhile, Moon Hyung-soon, the chief of Seongsanpo Police Station, refused an unjust order to carry out executions. Following the Incheon Landing Operation in September, the release of those held under preventive detention began, and in October, martial law on Jeju Island was lifted." },
      zh: { title: "预防性拘捕与集体屠杀", desc: "1950年6·25战争爆发后，济州地区以保导联盟成员及重点监视对象等为目标，实施了预防性拘捕与拘禁。7月至8月间，被预防性拘捕者在济州港外海、济州机场、炆岳峰等地遭到集体杀害。\n\n尤其在炆岳峰遇难的居民遗骸，因收殓延迟，直至1956年才被发掘，遗属们将多名遇难者的遗骨合葬，并命名为**\"百祖一孙之墓\"**。与此同时，城山浦警察署长文亨淳拒绝执行不当的枪决命令。9月仁川登陆作战后，预防性拘捕者开始获释，10月济州岛戒严令解除。" },
      ja: { title: "予備検束と集団虐殺", desc: "1950年、6·25戦争が勃発すると、済州では保導連盟員や要視察人などを対象に予備検束と拘禁が行われた。7月から8月にかけて、済州港沖や済州飛行場、ソッタルオルムなどで予備検束者が集団的に犠牲となった。\n\n特にソッタルオルムで犠牲になった住民の遺骸は収拾が遅れ、1956年になってようやく発掘された。遺族たちは複数の犠牲者の遺骨を合わせて埋葬し、**「百祖一孫之墓」**と名付けた。一方、文亨淳城山浦警察署長は不当な銃殺命令を拒否した。9月の仁川上陸作戦の後、予備検束者の釈放が始まり、10月には済州島の戒厳令が解除された。" } },
    { y: 1951,
      ko: { title: "피난민 유입과 군사기지화", desc: "1951년 1월, 육군 제1훈련소가 대구에서 제주도로 이전하면서 제주도의 군사적 역할이 커졌다. 당시 제주도에 유입된 피난민은 약 14만 8천 명으로 집계되었다.\n\n무장대와 토벌대의 충돌도 계속되었으며, 이 과정에서 경찰과 자위대, 민간인 피해도 발생했다." },
      en: { title: "Influx of Refugees and Militarization", desc: "In January 1951, the Army's 1st Training Center relocated from Daegu to Jeju Island, expanding Jeju's military role. In May, the Jeju Army Counter-Intelligence Corps was established, and the number of refugees who had flowed into Jeju at the time was recorded at about 148,000.\n\nMeanwhile, clashes between armed insurgents and suppression forces continued. The Jeju police announced results from operations conducted between October 1950 and April 1951, including insurgents killed and weapons seized, and in the process, police, local self-defense forces, and civilians also suffered casualties." },
      zh: { title: "避难民涌入与军事基地化", desc: "1951年1月，陆军第1训练所由大邱迁至济州岛，济州岛的军事地位随之提升。5月济州岛陆军特务队成立，当时涌入济州岛的避难民约达14万8千人。\n\n与此同时，武装队与讨伐队的冲突仍在持续。济州警方公布了1950年10月至1951年4月作战期间击毙武装队员、缴获武器等战果，在此过程中警察、自卫队及平民也蒙受损失。" },
      ja: { title: "避難民の流入と軍事基地化", desc: "1951年1月、陸軍第1訓練所が大邱から済州島へ移転し、済州島の軍事的役割が高まった。5月には済州島陸軍特務隊が創設され、当時済州島に流入した避難民は約14万8千人に上った。\n\n一方、武装隊と討伐隊の衝突も続いた。済州警察は1950年10月から1951年4月までの作戦で、武装隊の射殺や武器鹵獲などの戦果を発表したが、この過程で警察や自衛隊、民間人の被害も発生した。" } },
    { y: 1952,
      ko: { title: "잔여 무장대 진압 지속", desc: "1952년 제주에서는 잔여 무장대를 소탕하기 위한 진압작전이 계속되었다. 5월 제주도의회는 무장대가 귀순하면 생명을 보장한다는 하산권고문을 반포하기로 했다.\n\n무장대는 9월 제주방송국을 습격해 직원들을 납치하고, 10월에는 서귀포발전소에 불을 지르는 등 활동을 이어갔다." },
      en: { title: "Suppression of the Remaining Insurgents Continues", desc: "In 1952, suppression operations to wipe out the remaining armed insurgents in Jeju continued. In April, the Jeju District Residual Bandit Extermination Operation was carried out, and in May, the Jeju Provincial Council resolved to issue a proclamation guaranteeing the lives of insurgents who surrendered and came down from the mountains.\n\nMeanwhile, the armed insurgents continued their activities, breaking into the Jeju Broadcasting Station in September and abducting staff, and raiding and setting fire to the Seogwipo Power Plant in October. In November, the 100th Combat Police Headquarters was established under the Jeju Provincial Police Bureau, strengthening the police response to suppress the insurgents." },
      zh: { title: "持续镇压残余武装队", desc: "1952年济州地区为清剿残余武装队，镇压行动持续进行。4月展开济州岛地区残匪歼灭作战，5月济州道议会议决颁布劝降文，承诺武装队归顺后保障其生命安全。\n\n与此同时，武装队9月闯入济州广播局绑架职员，10月袭击西归浦发电所并纵火，活动仍在持续。11月济州道警察局下设的100战斗警察司令部成立，警方对武装队的镇压应对进一步加强。" },
      ja: { title: "残余武装隊の鎮圧続く", desc: "1952年、済州では残余武装隊を掃討するための鎮圧作戦が続いた。4月には済州島地区残匪殲滅作戦が展開され、5月の済州道議会は、武装隊が帰順すれば生命を保障するという下山勧告文を頒布することを議決した。\n\n一方、武装隊は9月に済州放送局に侵入して職員を拉致し、10月には西帰浦発電所を襲撃して放火するなど活動を続けた。11月には済州道警察局傘下に100戦闘警察司令部が創設され、武装隊鎮圧に向けた警察の対応も強化された。" } },
    { y: 1953,
      ko: { title: "무장대 토벌 작전 종료와\n주민 복귀 및 치안 안정화", desc: "1953년 1월, 육군 특수부대인 무지개부대가 제주에 투입되어 무장대 진압작전을 벌였고, 5월 작전을 종료했다.\n\n이후 파견 경찰이 철수했고, 11월에는 오랜 소개생활을 끝낸 주민들이 마을로 돌아오기 시작했다." },
      en: { title: "Suppression Ends, Residents Return, Security Stabilizes", desc: "In January 1953, 86 members of the Army's special Rainbow Unit were deployed to Jeju to carry out suppression operations against the armed insurgents, concluding the operation in May. Afterward, police forces dispatched from other regions withdrew, and in November, residents of some areas began returning to their villages after a long period of evacuation.\n\nThat same month, the Jeju Provincial Police Bureau announced the withdrawal of guard posts at police outposts across the island. However, the return of residents and the reconstruction of villages had to continue afterward." },
      zh: { title: "武装队讨伐行动结束、居民归乡与治安稳定", desc: "1953年1月，陆军特种部队彩虹部队86人被投入济州，执行武装队镇压作战，并于5月结束作战。此后从外地派遣的警力撤离，11月部分地区居民结束长期疏散生活，开始返回村庄。\n\n同月，济州道警察局宣布撤离岛内警察驻屯所的警备哨所警力。然而，居民的归乡与村庄重建此后仍需持续推进。" },
      ja: { title: "武装隊討伐作戦の終了と住民帰還・治安安定化", desc: "1953年1月、陸軍特殊部隊である虹部隊86人が済州に投入され、武装隊鎮圧作戦を行い、5月に作戦を終了した。その後、他地域から派遣された警察兵力が撤収し、11月には一部地域の住民が長い疎開生活を終えて村に戻り始めた。\n\n同月、済州道警察局は島内の警察駐屯所の警備哨所の兵力を撤収すると発表した。しかし住民の帰還と村の再建はその後も続けられる必要があった。" } },
    { y: 1954,
      ko: { title: "한라산 금족구역 해제", desc: "1954년 1월, 제주도경찰국은 잔여 무장대가 6명뿐이라고 발표했다. 4월에는 한라산이 부분 개방되어 산간마을 주민들의 복귀가 허용되었다.\n\n9월 21일 한라산 금족구역이 해제되면서 제주4·3사건 이후 이어졌던 출입 통제가 공식적으로 풀렸다." },
      en: { title: "The Off-Limits Zone on Mt. Halla Is Lifted", desc: "In January 1954, the Jeju Provincial Police Bureau announced that only six armed insurgents remained. In April, Mt. Halla was partially opened, allowing residents of mountain villages to move back in and return.\n\nOn September 21, the off-limits zone on Mt. Halla was lifted, officially ending the access restrictions that had continued since the Jeju 4·3 Incident. This became an important turning point toward the restoration of residents' daily lives and the reconstruction of villages." },
      zh: { title: "汉拿山禁足区解除", desc: "1954年1月，济州道警察局宣布残余武装队仅剩6人。4月汉拿山部分开放，山间村庄居民获准入住与返乡。\n\n9月21日，汉拿山禁足区解除，济州4·3事件以来持续的出入管制正式解除。这成为居民恢复日常生活与村庄重建的重要转折点。" },
      ja: { title: "漢拏山禁足区域の解除", desc: "1954年1月、済州道警察局は残余武装隊がわずか6人であると発表した。4月には漢拏山が部分的に開放され、山間村落の住民の入居と帰還が許可された。\n\n9月21日には漢拏山禁足区域が解除され、済州4·3事件以降続いていた立ち入り規制が正式に解かれた。これは住民の日常回復と村の再建に向けた重要な転換点となった。" } }
  ];

  const PAGE_TITLE = { ko: "4·3의 시간", en: "The Time of 4·3", zh: "4·3的时间", ja: "4·3の時間" };
  const SUBTITLE = {
    ko: "사진을 넘겨 연도를 고르고, 그 해의 기록을 확인하세요.",
    en: "Swipe through the photos to pick a year and view that year's records.",
    zh: "滑动照片选择年份，查看该年的记录。",
    ja: "写真をスワイプして年を選び、その年の記録を確認してください。"
  };
  const MORE_LINK = {
    ko: function (y, count) { return y + "년 전체 기록 보기" + (count ? " (" + count + "건)" : "") + " →"; },
    en: function (y, count) { return "View all records for " + y + (count ? " (" + count + ")" : "") + " →"; },
    zh: function (y, count) { return "查看" + y + "年全部记录" + (count ? "（" + count + "条）" : "") + " →"; },
    ja: function (y, count) { return y + "年の全記録を見る" + (count ? "（" + count + "件）" : "") + " →"; }
  };
  let currentLang = "ko";

  const carouselEl = document.getElementById("carousel");
  const carPrevEl = document.getElementById("carPrev");
  const carCenterEl = document.getElementById("carCenter");
  const carNextEl = document.getElementById("carNext");
  const carPrevImg = document.getElementById("carPrevImg");
  const carCenterImg = document.getElementById("carCenterImg");
  const carNextImg = document.getElementById("carNextImg");
  const yearBig = document.getElementById("yearBig");
  const eventTitle = document.getElementById("eventTitle");
  const eventDesc = document.getElementById("eventDesc");
  const dotsEl = document.getElementById("dots");
  const moreLink = document.getElementById("moreLink");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalBody = document.getElementById("modalBody");
  const modalClose = document.getElementById("modalClose");

  let current = 0;

  function wrap(i) {
    const n = YEARS.length;
    return ((i % n) + n) % n;
  }

  // 연도 사진: assets/years/연도.jpg 를 먼저 찾고, 없으면 .png, .jpeg 순서로 시도한다.
  // 셋 다 없으면 사진 없이 placeholder 색이 그대로 보인다.
  const PHOTO_EXTS = ["jpg", "png", "jpeg"];
  function loadYearPhoto(imgEl, year) {
    imgEl.classList.remove("loaded");
    let i = 0;
    function tryNext() {
      if (i >= PHOTO_EXTS.length) {
        imgEl.removeAttribute("src");
        return;
      }
      imgEl.src = "assets/years/" + year + "." + PHOTO_EXTS[i];
      i += 1;
    }
    imgEl.onerror = tryNext;
    imgEl.onload = function () {
      imgEl.classList.add("loaded");
      if (window.__fitScreen) window.__fitScreen();
    };
    tryNext();
  }

  // 글이 길어도 스크롤 없이 상자 안에 다 들어오도록, 넘치면 글자 크기를 한 단계씩 줄여본다
  const EVENT_DESC_SIZES = [13, 12.5, 12, 11.5, 11, 10.5, 10, 9.5, 9, 8.5, 8, 7.5, 7];
  function fitEventDesc() {
    let i = 0;
    eventDesc.style.fontSize = EVENT_DESC_SIZES[0] + "px";
    while (eventDesc.scrollHeight > eventDesc.clientHeight && i < EVENT_DESC_SIZES.length - 1) {
      i += 1;
      eventDesc.style.fontSize = EVENT_DESC_SIZES[i] + "px";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // **강조** → <strong>강조</strong>, 줄바꿈(문단 구분) → <br><br>
  function formatDesc(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n\n/g, "<br><br>");
  }

  // 제목 안의 줄바꿈(\n)을 <br>로: 특정 지점에서 줄을 미리 나눠야 하는 제목에 쓴다
  function formatTitle(text) {
    return escapeHtml(text).replace(/\n/g, "<br>");
  }

  // 점 표시: 연도마다 하나씩, 클릭하면 그 연도로 바로 이동
  const dotEls = YEARS.map(function (d, i) {
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.setAttribute("role", "button");
    dot.setAttribute("aria-label", d.y + "년");
    dot.addEventListener("click", function () { applyYear(i); });
    dotsEl.appendChild(dot);
    return dot;
  });

  function applyYear(index) {
    current = wrap(index);
    const d = YEARS[current];
    const t = d[currentLang] || d.ko;

    yearBig.textContent = d.y;
    eventTitle.innerHTML = formatTitle(t.title);
    eventDesc.innerHTML = formatDesc(t.desc);
    fitEventDesc();

    dotEls.forEach(function (el, i) { el.classList.toggle("active", i === current); });

    const prevIdx = wrap(current - 1);
    const nextIdx = wrap(current + 1);
    carPrevEl.dataset.idx = prevIdx;
    carNextEl.dataset.idx = nextIdx;
    loadYearPhoto(carPrevImg, YEARS[prevIdx].y);
    loadYearPhoto(carCenterImg, d.y);
    loadYearPhoto(carNextImg, YEARS[nextIdx].y);

    const count = (window.TIMELINE_FULL && window.TIMELINE_FULL[d.y] || []).length;
    moreLink.textContent = (MORE_LINK[currentLang] || MORE_LINK.ko)(d.y, count);

    if (modalBackdrop.classList.contains("open")) renderModal();

    if (window.__fitScreen) window.__fitScreen();
  }

  window.__applyLanguage = function (lang) {
    currentLang = lang;
    document.getElementById("pageTitle").textContent = PAGE_TITLE[lang] || PAGE_TITLE.ko;
    document.getElementById("subtitle").textContent = SUBTITLE[lang] || SUBTITLE.ko;
    applyYear(current);
  };

  // ---------- 캐러셀 스와이프: 손가락으로 밀면 연도가 넘어간다 ----------
  // (자식 탭 핸들러와 얽히지 않도록 포인터 캡처 대신 document 레벨에서 추적한다)
  let swipeActive = false;
  let swipeStartX = 0;
  let swipeDeltaX = 0;
  let activePointerId = null;
  let justSwiped = false;

  carouselEl.addEventListener("pointerdown", function (e) {
    swipeActive = true;
    swipeStartX = e.clientX;
    swipeDeltaX = 0;
    activePointerId = e.pointerId;
  });

  document.addEventListener("pointermove", function (e) {
    if (!swipeActive || e.pointerId !== activePointerId) return;
    swipeDeltaX = e.clientX - swipeStartX;
  });

  function finishSwipe(e) {
    if (!swipeActive || e.pointerId !== activePointerId) return;
    swipeActive = false;
    if (swipeDeltaX <= -28) { justSwiped = true; applyYear(current + 1); }
    else if (swipeDeltaX >= 28) { justSwiped = true; applyYear(current - 1); }
  }
  document.addEventListener("pointerup", finishSwipe);
  document.addEventListener("pointercancel", function (e) {
    if (e.pointerId === activePointerId) swipeActive = false;
  });

  function slotClick(el) {
    return function () {
      if (justSwiped) { justSwiped = false; return; }
      applyYear(parseInt(el.dataset.idx, 10));
    };
  }
  carPrevEl.addEventListener("click", slotClick(carPrevEl));
  carNextEl.addEventListener("click", slotClick(carNextEl));

  // ---------- 모달: 전체 일지 ----------
  function renderModal() {
    const d = YEARS[current];
    const records = (window.TIMELINE_FULL && window.TIMELINE_FULL[d.y]) || [];
    modalBody.innerHTML = records.map(function (r) {
      return '<div class="rec"><div class="rec-date">' + escapeHtml(r[0]) + '</div><div class="rec-text">' + escapeHtml(r[1]) + '</div></div>';
    }).join("");
  }
  function openModal() {
    renderModal();
    modalBackdrop.classList.add("open");
  }
  function closeModal() {
    modalBackdrop.classList.remove("open");
    modalBody.scrollTop = 0;
  }
  moreLink.addEventListener("click", openModal);
  modalClose.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function (e) {
    if (e.target === modalBackdrop) closeModal();
  });

  applyYear(0);
</script>
</body>
</html>
